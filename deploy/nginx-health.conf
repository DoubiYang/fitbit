server {
    listen 80;
    server_name health.doubiyang.com;
    location /.well-known/acme-challenge/ { root /var/www/fitbit-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name health.doubiyang.com;
    ssl_certificate /etc/letsencrypt/live/health.doubiyang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/health.doubiyang.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location = / { return 302 /rhythm/account; }
    location ~ ^/(mcp|authorize|token|register|revoke)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location ~ ^/\.well-known/oauth- {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /rhythm/mcp/consent {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /rhythm {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 404; }
}
