services:
  db:
    image: postgres:16
    env_file: .env.local
    environment:
      POSTGRES_USER: rhythm
      POSTGRES_DB: rhythm
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rhythm -d rhythm']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s

  app:
    build: .
    ports:
      - '3000:3000'
    env_file: .env.local
    environment:
      HOSTNAME: 0.0.0.0
      POSTGRES_HOST: db
      POSTGRES_USER: rhythm
      POSTGRES_DB: rhythm
      APP_BASE_PATH: /rhythm
    depends_on:
      db:
        condition: service_healthy
      nutrition-import:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3000/rhythm/account").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  sync:
    build: .
    command: ['node', 'worker/sync-loop.mjs']
    restart: unless-stopped
    env_file: .env.local
    environment:
      SYNC_ENDPOINT: http://app:3000/rhythm/api/internal/sync
    depends_on:
      app:
        condition: service_healthy

  nutrition-sync:
    build: .
    command: ['node', 'worker/nutrition-loop.mjs']
    restart: unless-stopped
    env_file: .env.local
    environment:
      NUTRITION_SYNC_ENDPOINT: http://app:3000/rhythm/api/internal/nutrition-sync
    depends_on:
      app:
        condition: service_healthy

  nutrition-import:
    build:
      context: .
      target: build
    command: ['pnpm', 'import:tw-fda', '--', 'data/tw-fda/food-composition.json.zip']
    restart: 'no'
    env_file: .env.local
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: rhythm
      POSTGRES_DB: rhythm
    depends_on:
      db:
        condition: service_healthy
